<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traslados Pablo - Asistencia Vial 24/7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* PALETA DE COLORES ARMONIZADA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: #F9FAFB;
            color: #111827;
        }

        /* Navegación */
        header {
            background-color: #111827;
            color: #FFFFFF;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #FACC15;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .menu a {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: #FACC15;
        }

        /* Sección Hero */
        .hero {
            background: linear-gradient(rgba(17, 24, 39, 0.95), rgba(17, 24, 39, 0.95)), url('https://images.unsplash.com/photo-1578328819058-b69f3a3b0f6b?auto=format&fit=crop&w=1200&q=80') no-repeat center center/cover;
            color: #FFFFFF;
            padding: 80px 20px;
            text-align: center;
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 40px;
            color: #FACC15;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 19px;
            margin-bottom: 35px;
            color: #E5E7EB;
        }

        /* Botones */
        .emergency-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }

        .btn-call {
            background-color: #FACC15;
            color: #111827;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #FFFFFF;
        }

        /* Sección Galería Externa limpia */
        .gallery-section {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            background-color: #F9FAFB;
        }

        .gallery-section h3 {
            font-size: 32px;
            margin-bottom: 40px;
            color: #111827;
            position: relative;
            display: inline-block;
        }

        .gallery-section h3::after {
            content: '';
            width: 60px;
            height: 4px;
            background-color: #FACC15;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .grid-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .grid-gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 3px solid #FFFFFF;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .grid-gallery img:hover {
            transform: scale(1.03);
        }

        /* Sección Servicios */
        .services {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .services h2 {
            font-size: 32px;
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
            color: #111827;
        }

        .services h2::after {
            content: '';
            width: 60px;
            height: 4px;
            background-color: #FACC15;
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .service-card {
            background-color: #FFFFFF;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-bottom: 4px solid #111827;
        }

        .service-card i {
            font-size: 44px;
            color: #FACC15;
            margin-bottom: 20px;
        }

        .service-card h3 {
            margin-bottom: 12px;
            font-size: 22px;
            color: #111827;
        }

        .service-card p {
            color: #4B5563;
            line-height: 1.5;
        }

        /* Formulario Larga Distancia */
        .form-section {
            background-color: #111827;
            color: #FFFFFF;
            padding: 45px;
            border-radius: 12px;
            max-width: 700px;
            margin: 0 auto;
            text-align: left;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .form-section h3 {
            color: #FACC15;
            margin-bottom: 12px;
            font-size: 26px;
            text-align: center;
        }

        .form-section p {
            text-align: center;
            margin-bottom: 30px;
            color: #9CA3AF;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #E5E7EB;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #1F2937;
            color: #FFFFFF;
            font-size: 16px;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: 2px solid #FACC15;
        }

        .btn-submit {
            background-color: #FACC15;
            color: #111827;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #E2B80D;
            transform: translateY(-1px);
        }

        /* Sección Contacto */
        .contact {
            background-color: #E5E7EB;
            padding: 60px 20px;
            text-align: center;
            color: #111827;
        }

        .contact-info {
            max-width: 600px;
            margin: 0 auto;
        }

        .contact h2 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .contact p {
            font-size: 19px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .contact i {
            color: #111827;
            font-size: 22px;
        }

        /* Footer */
        footer {
            background-color: #111827;
            color: #9CA3AF;
            text-align: center;
            padding: 25px 20px;
            font-size: 15px;
            border-top: 1px solid #1F2937;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            .hero h1 {
                font-size: 32px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
            .form-section {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-truck-pickup"></i> TRASLADOS PABLO
            </div>
            <ul class="menu">
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#servicios">Servicios</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section id="inicio" class="hero">
        <div class="hero-content">
            <h1>¿Te quedaste varado? Asistencia Vial Rápida</h1>
            <p>Más de 12 años de experiencia brindando un servicio veloz, seguro y efectivo para autos, camionetas y motocicletas. Las 24 horas.</p>
            
            <div class="emergency-buttons">
                <a href="tel:+5491133859876" class="btn btn-call">
                    <i class="fa-solid fa-phone-flip"></i> Llamar Ahora
                </a>
